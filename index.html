<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0F1B2A" />
<title>Caiu Gelo — Boca Gelada</title>
<style>
  :root{
    --bg:#F4F6F8; --panel:#FFFFFF; --ink:#0F1B2A; --ink-2:#3A4A5C; --ink-3:#7A8899;
    --line:#E1E7ED; --line-2:#C7D0DA; --accent:#0B6E8C; --ok:#177245; --err:#B0203C; --radius:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.35}
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 150px}

  header{display:flex;align-items:baseline;justify-content:space-between;padding:4px 2px 12px;border-bottom:2px solid var(--ink)}
  header h1{margin:0;font-size:22px;font-weight:800}
  header h1 span{color:var(--accent)}
  header .meta{font-size:12px;color:var(--ink-3);text-align:right}

  section{margin-top:16px}
  h2{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .chip{border:2px solid var(--line-2);background:#fff;border-radius:var(--radius);padding:14px 10px;font:inherit;
    font-size:16px;font-weight:600;color:var(--ink);text-align:left;display:flex;align-items:center;gap:10px;min-height:56px;cursor:pointer}
  .chip .dot{width:18px;height:18px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
  .chip.on{border-color:var(--ink);background:var(--ink);color:#fff}

  .formas{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;
    display:flex;align-items:center;justify-content:space-between}
  .formas button{width:56px;height:56px;border-radius:50%;border:1px solid var(--line-2);background:#fff;font-size:28px;font-weight:700;color:var(--ink)}
  .formas .n{text-align:center}
  .formas .n b{font-size:36px;font-weight:800;display:block}
  .formas .n small{font-size:13px;color:var(--ink-3)}

  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px}
  .kpi .l{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .kpi .v{font-size:30px;font-weight:800;color:var(--ok)}
  .fbar{display:grid;grid-template-columns:130px 1fr 54px;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--line);font-size:14px}
  .fbar .nm{display:flex;align-items:center;gap:7px}
  .fbar .nm i{width:11px;height:11px;border-radius:50%;flex:none}
  .fbar .bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
  .fbar .bar div{height:100%;transition:width .5s ease}
  .fbar .q{text-align:right;font-weight:800}
  .vazio{color:var(--ink-3);font-style:italic;font-size:14px;padding:8px 2px}

  .rodape{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line-2);
    padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
  .rodape .in{max-width:560px;margin:0 auto}
  #ok{width:100%;border:0;border-radius:14px;background:var(--ok);color:#fff;font:inherit;font-size:24px;font-weight:800;padding:20px}
  #ok:disabled{background:var(--line-2);color:#fff}
  #msg{text-align:center;font-weight:700;font-size:15px;min-height:22px;margin-bottom:6px;color:var(--ink-3)}
  #msg.ok{color:var(--ok)} #msg.err{color:var(--err)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Caiu <span>Gelo</span></h1>
    <div class="meta">Boca Gelada<br/><span id="data" class="num"></span></div>
  </header>

  <section>
    <h2>1 · Sabor</h2>
    <div class="grid" id="sabores"></div>
  </section>

  <section>
    <h2>2 · Formas que caíram</h2>
    <div class="formas">
      <button onclick="mudar(-1)" aria-label="menos">−</button>
      <div class="n"><b id="f" class="num">19</b><small id="cx">= 10 caixas</small></div>
      <button onclick="mudar(1)" aria-label="mais">+</button>
    </div>
  </section>

  <section>
    <h2>Produzido hoje</h2>
    <div class="kpis">
      <div class="kpi"><div class="l">Caixas</div><div class="v num" id="kCx">—</div></div>
      <div class="kpi"><div class="l">Ciclos</div><div class="v num" id="kCi">—</div></div>
    </div>
    <div id="barras" style="margin-top:8px"></div>
  </section>
</div>

<div class="rodape"><div class="in">
  <div id="msg">Escolha o sabor</div>
  <button id="ok" onclick="enviar()" disabled>✔ CAIU GELO</button>
</div></div>

<script>
// Link do App da Web do Apps Script da planilha PRODUÇÃO BOCA GELADA
const API = 'COLE_AQUI_O_LINK_DO_APP_DA_WEB';

// Nomes iguais aos da aba Cadastros (J5:J17)
const SABORES = [
  ['S.01 - Água de coco','#EDE4D3'], ['S.02 - Morango','#E74C3C'], ['S.03 - Maracujá','#F4C724'],
  ['S.04 - Maçã Verde','#8BC34A'],   ['S.05 - Bob','#9B59B6'],     ['S.06 - Melancia','#EC7B93'],
  ['S.07 - Limão','#B8D95A'],        ['S.08 - Laranja','#F39C12'], ['S.09 - Limão com sal','#A8C88F'],
  ['S.10 - Frutas cítricas','#F1C40F'], ['S.11 - Frutas vermelhas','#8E1E3B'], ['S.12 - Abacaxi','#F5D547'],
  ['S.13 - Brasil','#1E9E4A']
];
const curto = s => s.replace(/^S\.\d+\s*-\s*/, '');
const caixas = f => Math.round(f * 16 / 30);
let sabor = '', formas = 19;

document.getElementById('data').textContent = new Date().toLocaleDateString('pt-BR');

const g = document.getElementById('sabores');
SABORES.forEach(([nome, cor]) => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.innerHTML = `<span class="dot" style="background:${cor}"></span>${curto(nome)}`;
  b.onclick = () => {
    sabor = nome;
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('ok').disabled = false;
    aviso(curto(nome) + ' · ' + formas + ' formas');
  };
  g.appendChild(b);
});

function aviso(t, cls){ const m = document.getElementById('msg'); m.textContent = t; m.className = cls || ''; }

function mudar(d){
  formas = Math.min(19, Math.max(1, formas + d));
  document.getElementById('f').textContent = formas;
  document.getElementById('cx').textContent = '= ' + caixas(formas) + ' caixas';
  if (sabor) aviso(curto(sabor) + ' · ' + formas + ' formas');
}

function mostrar(h){
  document.getElementById('kCx').textContent = h.caixas;
  document.getElementById('kCi').textContent = h.ciclos;
  const max = Math.max(1, ...Object.values(h.porSabor || {}));
  const linhas = SABORES.filter(([n]) => (h.porSabor || {})[n])
    .sort((a, b) => h.porSabor[b[0]] - h.porSabor[a[0]])
    .map(([n, cor]) => `<div class="fbar"><div class="nm"><i style="background:${cor}"></i>${curto(n)}</div>
      <div class="bar"><div style="width:${h.porSabor[n] / max * 100}%;background:${cor}"></div></div>
      <div class="q num">${h.porSabor[n]} cx</div></div>`).join('');
  document.getElementById('barras').innerHTML = linhas || '<div class="vazio">Nada apontado hoje ainda.</div>';
}

function chamar(dados){
  return fetch(API, { method: 'POST', body: JSON.stringify(dados) }).then(r => r.json());
}

function enviar(){
  if (!sabor) return;
  const ok = document.getElementById('ok'); ok.disabled = true;
  aviso('Enviando…');
  chamar({ acao: 'caiu', sabor, formas })
    .then(r => {
      aviso('✔ +' + r.caixas + ' cx de ' + curto(sabor) + ' (' + r.hora + ')', 'ok');
      mostrar(r.hoje);
      if (navigator.vibrate) navigator.vibrate(120);
      formas = 19;
      document.getElementById('f').textContent = 19;
      document.getElementById('cx').textContent = '= 10 caixas';
    })
    .catch(() => aviso('⚠ Não foi. Confira a internet e toque de novo.', 'err'))
    .finally(() => { ok.disabled = false; });
}

chamar({ acao: 'hoje' }).then(r => mostrar(r.hoje)).catch(() => aviso('⚠ Sem conexão com a planilha', 'err'));
</script>
</body>
</html>
